name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan-ubsan:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_init_order=1:check_initialization_order=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - name: Configure
        run: >-
          cmake -S . -B build/asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DAETHER_BUILD_TESTS=ON
          -DAETHER_BUILD_EXAMPLES=ON
          -DAETHER_BUILD_TOOLS=ON
          -DAETHER_BUILD_APPS=ON
          -DAETHER_BUILD_BENCHMARKS=OFF
          -DAETHER_ENABLE_ASAN=ON
          -DAETHER_ENABLE_UBSAN=ON
          -DAETHER_ENABLE_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build/asan
      - run: ctest --test-dir build/asan --output-on-failure

  tsan:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - name: Configure
        run: >-
          cmake -S . -B build/tsan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DAETHER_BUILD_TESTS=ON
          -DAETHER_BUILD_EXAMPLES=ON
          -DAETHER_BUILD_TOOLS=ON
          -DAETHER_BUILD_APPS=ON
          -DAETHER_BUILD_BENCHMARKS=OFF
          -DAETHER_ENABLE_TSAN=ON
          -DAETHER_ENABLE_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build/tsan
      - run: ctest --test-dir build/tsan --output-on-failure
