name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-format ninja-build
      - name: Check formatting
        run: ./scripts/format_all.sh --check

  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: >-
          cmake -S . -B build/${{ matrix.build_type }} -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DAETHER_BUILD_TESTS=ON
          -DAETHER_BUILD_EXAMPLES=ON
          -DAETHER_BUILD_TOOLS=ON
          -DAETHER_BUILD_APPS=ON
          -DAETHER_BUILD_BENCHMARKS=OFF
          -DAETHER_ENABLE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/${{ matrix.build_type }}
      - name: Test
        run: ctest --test-dir build/${{ matrix.build_type }} --output-on-failure

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy clang ninja-build
      - name: Configure
        run: >-
          cmake -S . -B build/tidy -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DAETHER_BUILD_TESTS=ON
          -DAETHER_BUILD_EXAMPLES=ON
          -DAETHER_BUILD_TOOLS=ON
          -DAETHER_BUILD_APPS=ON
          -DAETHER_BUILD_BENCHMARKS=OFF
          -DAETHER_ENABLE_CLANG_TIDY=ON
          -DAETHER_ENABLE_WARNINGS_AS_ERRORS=OFF
      - name: Build with clang-tidy
        run: cmake --build build/tidy

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure package build
        run: >-
          cmake -S . -B build/package -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DAETHER_BUILD_TESTS=ON
          -DAETHER_BUILD_EXAMPLES=ON
          -DAETHER_BUILD_TOOLS=OFF
          -DAETHER_BUILD_APPS=OFF
          -DAETHER_BUILD_BENCHMARKS=OFF
          -DAETHER_ENABLE_INSTALL=ON
      - name: Build
        run: cmake --build build/package
      - name: Test
        run: ctest --test-dir build/package --output-on-failure
      - name: Install
        run: cmake --install build/package --prefix install/aether
      - name: Create consumer project
        run: |
          mkdir -p package-smoke
          cat > package-smoke/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(AetherPackageSmoke LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          find_package(AetherStream CONFIG REQUIRED)
          add_executable(package_smoke main.cpp)
          target_link_libraries(package_smoke PRIVATE aether::stream)
          CMAKE
          cat > package-smoke/main.cpp <<'CPP'
          #include <aether/version.hpp>
          #include <iostream>
          int main() {
            std::cout << aether::version_string() << '\n';
            return aether::version_string().empty() ? 1 : 0;
          }
          CPP
      - name: Build and run consumer
        run: |
          cmake -S package-smoke -B package-smoke/build -G Ninja -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install/aether"
          cmake --build package-smoke/build
          ./package-smoke/build/package_smoke
